name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          ADCB33: ${{ secrets.ADCB33 }}
          B8E85F: ${{ secrets.B8E85F }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('ADCB33', '')
          env_b = os.environ.get('B8E85F', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 35cb237709998c6111 -->', env_a)
          if env_b:
              result = result.replace('<!-- c7a32142b5846da7be3484370746ee0ad19850e0de6e34 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
